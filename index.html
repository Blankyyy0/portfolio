<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Coming Soon</title>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e8e8ea;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700; letter-spacing: -0.02em; }
    p { margin-top: 1rem; color: #9a9ca3; font-size: 1.125rem; }
    .dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%;
           background: #4f8cff; margin-right: .5em; animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio</h1>
    <p><span class="dot"></span>Something new is on the way. Check back soon.</p>
  </main>
</body>
</html>
